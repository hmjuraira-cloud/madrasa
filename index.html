<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0b3b35"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>মাদ্রাসা ব্যবস্থাপনা</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@600;700&family=Amiri&family=Anek+Bangla:wght@500;700&family=Baloo+Da+2:wght@500;700&display=swap" rel="stylesheet">
<style>

button.alt{background:transparent;color:var(--g);box-shadow:inset 0 0 0 1.5px var(--g)}button.del{background:linear-gradient(135deg,#ef476f,#e5484d)}button.sm,.btn.sm{padding:5px 12px;font-size:14px}

.av{width:54px;height:54px;flex:none;border-radius:50%;box-shadow:0 0 0 2.5px var(--gold);background:linear-gradient(135deg,#0f766e,#7c5cff);color:#fff;display:grid;place-items:center;font:700 22px 'Noto Serif Bengali',serif;object-fit:cover}
.pz{display:grid;grid-template-columns:repeat(30,1fr);gap:2px;margin-top:10px}.pz i{height:8px;border-radius:2px;background:var(--ln)}.pz i.f{background:linear-gradient(var(--gold),#f59e0b)}

.tg{display:flex;gap:6px}.tg button{background:var(--ln);color:var(--tx);box-shadow:none;padding:6px 12px}.tg button.p{background:var(--ok);color:#fff}.tg button.ab{background:var(--r);color:#fff}
#sh{position:fixed;inset:0;background:rgba(8,12,30,.55);display:none;align-items:flex-end;z-index:9}#sh.o{display:flex}#sh>div{background:var(--bg);width:100%;max-height:92%;overflow:auto;border-radius:26px 26px 0 0;padding:16px;max-width:640px;margin:auto}
.empty{text-align:center;color:var(--mu);padding:22px 8px}.log{font-size:14px;border-bottom:1px dashed var(--ln);padding:5px 0}.bd{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--ln);color:var(--mu)}
.grid>div{min-width:0}input[type=date],input[type=month]{font-size:14px;padding:11px 8px;min-width:0;height:48px;-webkit-appearance:none;appearance:none;text-align:left}
.dtw{position:relative;display:flex;align-items:center;height:48px;padding:0 12px;border:1.5px solid var(--ln);border-radius:14px;background:var(--sf);margin:3px 0 10px;font-size:15px}.dtw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0}
.pz i.w{background:#fcd34d}.hg{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0}button.hc{background:var(--ln);color:var(--tx);box-shadow:none;border-radius:12px;padding:10px 0}button.hc.c{background:#fcd34d;color:#3a2a00}button.hc.d{background:linear-gradient(135deg,#f3cb62,#c98a1b);color:#1a1200}
.pw{display:flex;gap:10px;flex-wrap:wrap}button.sw{width:38px;height:38px;border-radius:50%;padding:0;box-shadow:0 0 0 2px var(--ln)}button.sw.on{box-shadow:0 0 0 3px var(--gold)}.cvw{display:block;width:100%;max-width:360px;margin:10px auto;border-radius:14px;box-shadow:var(--sh)}input[type=color]{height:44px;padding:4px}#pr{display:none}@media print{@page{margin:8mm}body>*:not(#pr){display:none!important}#pr{display:grid!important;gap:3mm}#pr img{display:block}}

body.cm header{display:none}body.cm main{padding-top:8px}body.cm #cvw{position:sticky;top:0;z-index:6}body.cm .cvw{max-height:38vh;width:auto;max-width:100%;margin:6px auto}.chs.wrap{flex-wrap:wrap;overflow:visible}#upd{position:fixed;top:10px;left:10px;right:10px;background:#0f766e;color:#fff;padding:10px 14px;border-radius:16px;z-index:20;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--sh)}#hl img{width:auto;height:74px;max-width:220px;object-fit:contain;background:#fff;border-radius:20px;padding:7px 14px;box-shadow:0 0 0 3px var(--gold),0 10px 24px -8px rgba(0,0,0,.5);margin-bottom:10px}#adr{margin:2px 0 0;font-size:13px;opacity:.85}
</style></head><body>
<header><div id="hl" style="display:none"><img id="hli" alt=""></div><div class="bsm">بِسْمِ ٱللَّٰهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div><h1 id="ttl"></h1><p id="sub"></p><p id="adr"></p></header><main id="m"></main>
<nav id="nv"></nav><div id="sh" onclick="if(event.target==this)cl()"><div id="shc"></div></div><div id="pr"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const loc=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString();
let D={name:'আমার মাদ্রাসা',pin:'',s:[],a:{},t:[],n:[],r:[],rn:0},tab='h',q='',cf='',mon=loc().slice(0,7),ad=loc().slice(0,10),ok=false,ex='প্রথম সাময়িক',SS={},SM='',AU='all',PH='';

let svT;const save=()=>{clearTimeout(svT);svT=setTimeout(async()=>{const t=JSON.stringify(D);if(!(await kvSet('mdb',t)))try{localStorage.setItem('mdb',t)}catch(e){}},120)};
const N=n=>Number(n||0).toLocaleString(L()),M=n=>'৳'+N(n),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const L=()=>D.dg=='bn'?'bn-BD':'bn-BD-u-nu-latn';
const G={em:'#34d399,#0f9f78',sk:'#5eb0ff,#2f6fed',am:'#fcd34d,#f59e0b',ro:'#ff8fab,#ef476f',vi:'#a99bff,#6d5cff',te:'#5eead4,#0ea5a4'};
const ic=(k,e)=>`<div class="ic" style="background:linear-gradient(135deg,${G[k]})">${e}</div>`;
const CI=['মাসিক ফি','ভর্তি ফি','দান/চাঁদা','যাকাত/সদকা','অন্যান্য আয়'],CO=['শিক্ষকের বেতন','খাবার/বাজার','বিদ্যুৎ/পানি/গ্যাস','ভাড়া','কিতাব/সামগ্রী','মেরামত','অন্যান্য খরচ'];
const act=()=>D.s.filter(s=>s.st!='x'),mn=()=>new Date().toLocaleDateString(L(),{month:'long'});
const paid=(id,m)=>D.t.filter(x=>x.sid==id&&x.cat=='মাসিক ফি'&&x.d.startsWith(m)).reduce((a,x)=>a+ +x.amt,0);
const dues=m=>act().filter(s=>+s.f>0).map(s=>({s,due:s.f-paid(s.id,m)})).filter(x=>x.due>0);
const sum=(m,t)=>D.t.filter(x=>x.t==t&&x.d.startsWith(m)).reduce((a,x)=>a+ +x.amt,0);
const sh=h=>{$('#shc').innerHTML=h;$('#sh').classList.add('o')},cl=()=>$('#sh').classList.remove('o'),go=t=>{cl();tab=t;draw();scrollTo(0,0)};
const av=s=>s.ph?`<img class="av" src="${s.ph}" alt="">`:`<div class="av">${E((s.n||'?').trim().charAt(0))}</div>`;
const hz=s=>s.hz||Object.fromEntries(Array.from({length:+s.para||0},(_,i)=>[i+1,{st:'d'}])),dn=s=>Object.values(hz(s)).filter(x=>x.st=='d').length;
const pz=s=>{const h=hz(s);return '<div class="pz">'+Array.from({length:30},(_,i)=>`<i class="${(h[i+1]||{}).st=='d'?'f':(h[i+1]||{}).st=='c'?'w':''}"></i>`).join('')+'</div>'};
const RT={'ভালো':'in','মোটামুটি':'','দুর্বল':'out'};
const hl=s=>(s.log||[]).slice(-7).reverse().map(l=>`<div class="log"><span class="mu">${new Date(l.d).toLocaleDateString(L(),{day:'numeric',month:'short'})}</span> ${l.t?E(l.t):`<b>সবক:</b> ${E(l.sb)||'—'} · <b>সবকি:</b> ${E(l.sk)||'—'} · <b>মানযিল:</b> ${E(l.mz)||'—'} <span class="${RT[l.rt]||''}">${E(l.rt)}</span>`}</div>`).join('')||'<div class="mu">এখনো কিছু লেখা হয়নি</div>';
function hzF(id){const s=D.s.find(x=>x.id==id);s.hz=hz(s);const h=s.hz,n=dn(s);
 sh(`<h2>${E(s.n)} · হিফজ</h2><div class="mu">সম্পন্ন ${N(n)}/${N(30)} পারা ${n==30?'🎉 মাশাআল্লাহ, হিফজ সম্পন্ন':''}</div>
 <div class="hg">${Array.from({length:30},(_,i)=>`<button class="hc ${(h[i+1]||{}).st||''}" onclick="hzT('${id}',${i+1})">${N(i+1)}</button>`).join('')}</div>
 <p class="mu">পারার ঘরে চাপুন: ফাঁকা → চলছে (হলুদ) → সম্পন্ন (সোনালি) → ফাঁকা।</p>
 <h2>আজকের পড়া</h2><label>সবক</label><input id="h1" placeholder="যেমন: পারা 3, পৃষ্ঠা 2-4"><label>সবকি</label><input id="h2"><label>মানযিল</label><input id="h3"><label>মূল্যায়ন</label><select id="h4"><option>ভালো</option><option>মোটামুটি</option><option>দুর্বল</option></select>
 <button onclick="hzA('${id}')">যোগ করুন</button><h2>সাম্প্রতিক</h2><div id="hl">${hl(s)}</div>`)}
function hzT(id,p){const s=D.s.find(x=>x.id==id),h=s.hz=hz(s),c=h[p]||{};const y=$('#shc').scrollTop;
 if(!c.st)h[p]={st:'c'};else if(c.st=='c')h[p]={st:'d',dt:loc().slice(0,10)};else delete h[p];
 s.para=dn(s);save();hzF(id);$('#shc').scrollTop=y;draw()}
function hzA(id){const s=D.s.find(x=>x.id==id),o={d:loc().slice(0,10),sb:$('#h1').value.trim(),sk:$('#h2').value.trim(),mz:$('#h3').value.trim(),rt:$('#h4').value};
 if(!o.sb&&!o.sk&&!o.mz){alert('সবক, সবকি বা মানযিল লিখুন');return}(s.log=s.log||[]).push(o);save();hzF(id);draw()}
const ap=id=>{const d=Object.values(D.a).filter(a=>a[id]!=null);return d.length?' · উপস্থিতি '+N(Math.round(d.filter(a=>a[id]==1).length/d.length*100))+'%':''};
const lg=s=>(s.log||[]).slice(-6).reverse().map(l=>`<div class="log"><span class="mu">${new Date(l.d).toLocaleDateString(L())}</span> ${E(l.t)}</div>`).join('')||'<div class="mu">এখনো কিছু লেখা হয়নি</div>';
function lgA(id){const s=D.s.find(x=>x.id==id),t=$('#lg').value.trim();if(!t)return;(s.log=s.log||[]).push({d:loc().slice(0,10),t});save();$('#lg').value='';$('#lgl').innerHTML=lg(s)}
const fd=(v,t)=>{if(!v)return 'বাছুন';const[y,m,d]=v.split('-');return t=='month'?new Date(y,m-1,1).toLocaleDateString(L(),{month:'long',year:'numeric'}):new Date(y,m-1,d).toLocaleDateString(L(),{day:'numeric',month:'short',year:'numeric'})};
const dd=(id,v,t,oc)=>`<div class="dtw"><span id="${id}l">${fd(v,t)}</span><input type="${t||'date'}" id="${id}" value="${E(v)}" onchange="$('#${id}l').textContent=fd(this.value,'${t||'date'}');${oc||''}"></div>`;
const sms=(p,m)=>location.href='sms:'+p+'?body='+encodeURIComponent(m);
function draw(){
 if(D.pin&&!ok){$('#ttl').textContent=D.name;$('#sub').textContent='প্রবেশ করুন';$('#nv').innerHTML='';$('#m').innerHTML='<div class="card"><label>পিন লিখুন</label><input id="pn" type="password" inputmode="numeric"><button onclick="if($(\'#pn\').value==D.pin){ok=true;draw()}else{alert(\'পিন ভুল\')}">খুলুন</button></div>';return}
 document.body.classList.toggle('cm',tab=='c');if(!D.reg){$('#hl').style.display='none';$('#ttl').textContent='নিবন্ধন';$('#sub').textContent='প্রতিষ্ঠানের তথ্য দিয়ে শুরু করুন';$('#adr').textContent='';$('#nv').innerHTML='';$('#m').innerHTML=vReg();document.body.classList.remove('cm');return}
 $('#hl').style.display=D.logo?'block':'none';$('#hli').style.height=({s:120,m:160,l:200,x:240}[D.lz||'l'])+'px';$('#adr').textContent=(D.sa&&D.reg&&D.reg.ad)?D.reg.ad:'';if(D.logo)trU(D.logo).then(u=>{$('#hli').src=u});$('#ttl').textContent=D.name;$('#sub').textContent=new Date().toLocaleDateString(L(),{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 const T=[['h','🏠','হোম'],['s','👥','শিক্ষার্থী'],['p','✅','হাজিরা'],['k','📒','হিসাব'],['r','🏅','ফলাফল'],['x','⚙️','আরও']];
 $('#nv').innerHTML=T.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}<br>${t[2]}</button>`).join('');
 $('#m').innerHTML={h:vHome,s:vStu,p:vAtt,k:vAcc,r:vRes,x:vMore,c:vCard,g:vReg}[tab]();if(tab=='c')rdC();
}
const nvL=l=>l.map(n=>`<div class="card row" onclick="nvF('${n.id}')"><div><span class="bd">${E(n.ty)}</span> <b>${E(n.t)}</b><div class="mu">${new Date(n.d).toLocaleDateString(L())} ${E(n.b).slice(0,60)}</div></div><span>›</span></div>`).join('');
function vHome(){
 const m=loc().slice(0,7),td=loc().slice(0,10),A=act(),a=D.a[td]||{},pc=A.filter(s=>a[s.id]==1).length,ac=A.filter(s=>a[s.id]==0).length,dl=dues(m),dt=dl.reduce((x,y)=>x+y.due,0);
 const S=[['মোট শিক্ষার্থী',N(D.s.length),'sk','👥'],['সক্রিয় শিক্ষার্থী',N(A.length),'em','✅'],['আজ উপস্থিত',N(pc),'te','🟢'],['আজ অনুপস্থিত',N(ac),'ro','🔴'],['এ মাসের আয়',M(sum(m,'in')),'am','💰'],['মোট বকেয়া',M(dt),'vi','⏳']];
 const Q=[['➕','নতুন ভর্তি','stF()','em'],['✅','হাজিরা',"go('p')",'te'],['💵','ফি আদায়',"txF('in')",'am'],['🧾','খরচ',"txF('out')",'ro'],['💬','SMS পাঠান','smsC()','vi'],['📢','নোটিশ','nvF()','sk']];
 return `<div class="grid pull">${S.map(x=>`<div class="st">${ic(x[2],x[3])}<div><div class="mu">${x[0]}</div><div class="big">${x[1]}</div></div></div>`).join('')}</div>
 <div class="card fl" style="justify-content:space-between"><span class="mu">এ মাসের খরচ <b class="out">${M(sum(m,'out'))}</b></span><span class="mu">সঞ্চয় <b>${M(sum(m,'in')-sum(m,'out'))}</b></span></div>
 <h2>দ্রুত কাজ</h2><div class="grid g3">${Q.map(x=>`<button class="tl" onclick="${x[2]}">${ic(x[3],x[0])}${x[1]}</button>`).join('')}</div>
